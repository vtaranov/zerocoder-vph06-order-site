limit_req_zone $binary_remote_addr zone=auth_limit:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=metrics_limit:1m rate=2r/s;
server {
    listen 8080;
    server_name localhost;
    location = /health { access_log off; return 200 'ok\n'; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 32k;
    limit_req_status 429;
    location = /docs { return 404; }
    location = /api/openapi.json { return 404; }
    location /api/static/ { return 404; }
    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control no-store always;
    }
    location = /api/behavior-metrics {
        limit_req zone=metrics_limit burst=5 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        add_header Cache-Control no-store always;
    }
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        add_header Cache-Control no-store always;
    }
    location /assets/ { root /usr/share/nginx/html; try_files $uri =404; expires 7d; }
    location = /favicon.svg { root /usr/share/nginx/html; }
    location = / { root /usr/share/nginx/html; try_files /index.html =404; add_header Cache-Control no-cache; }
    location = /admin { root /usr/share/nginx/html; try_files /admin.html =404; add_header Cache-Control no-store always; }
    location = /admin/ { return 308 /admin; }
    location / { return 404; }
}
